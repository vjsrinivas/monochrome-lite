services:
    # Production frontend -- always runs
    monochrome:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            args:
                - POCKETBASE_URL=${POCKETBASE_URL}
        container_name: monochrome
        ports:
            - '${MONOCHROME_PORT:-3000}:4173'
        restart: unless-stopped
        networks:
            - monochrome-network
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4173/']
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s

    # PocketBase backend -- only starts with: docker compose --profile pocketbase up -d
    pocketbase:
        image: ghcr.io/muchobien/pocketbase:latest
        container_name: monochrome-pocketbase
        profiles:
            - pocketbase
        restart: unless-stopped
        environment:
            PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@example.com}
            PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-changeme}
            TZ: ${TZ:-UTC}
        ports:
            - '${POCKETBASE_PORT:-8090}:8090'
        # First arg starts with "-" => the image entrypoint keeps its default
        # serve args (--dir=/pb_data, --publicDir, --hooksDir, auto-superuser)
        # and appends this flag. Default migrations dir is resolved next to the
        # pocketbase executable, so the git-tracked pb_migrations must be wired
        # explicitly.
        command: ['--migrationsDir', '/pb_data/pb_migrations']
        volumes:
            - pb_data:/pb_data
            - ./../pb_migrations:/pb_data/pb_migrations:ro
            - pb_public:/pb_public
            - pb_hooks:/pb_hooks
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/api/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - monochrome-network

    # Development server -- only starts with: docker compose --profile dev up -d
    monochrome-dev:
        build:
            context: ..
            dockerfile: docker/Dockerfile.dev
        container_name: monochrome-dev
        profiles:
            - dev
        ports:
            - '${MONOCHROME_DEV_PORT:-5173}:5173'
        volumes:
            - ..:/app
            - /app/node_modules
        command: npm run dev -- --host 0.0.0.0
        networks:
            - monochrome-network

networks:
    monochrome-network:
        driver: bridge

volumes:
    pb_data:
    pb_public:
    pb_hooks:
